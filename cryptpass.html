                <button class="nav-item ${state.screen === "list" ? "active" : ""}" id="nav-btn-list" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; text-align: left; transition: all 0.15s; ${state.screen === "list" ? "background: rgba(0,247,130,0.1); color: var(--accent);" : "color: var(--muted);"}">
                  ${icon("key", 17)}
                  <span>保管庫</span>
                  <span style="margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--panel2); color: var(--muted); font-weight: 700;">${state.data.entries.length}</span>
                </button>
                <button class="nav-item ${state.screen === "settings" ? "active" : ""}" id="nav-btn-settings" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; text-align: left; transition: all 0.15s; ${state.screen === "settings" ? "background: rgba(0,247,130,0.1); color: var(--accent);" : "color: var(--muted);"}">
                  ${icon("settings", 17)}
                  <span>設定</span>
                </button>
              </nav>

              <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
                <div class="panel" style="padding: 12px;">
                  <div style="display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 11.5px; font-weight: 700;">
                    ${icon("shieldCheck", 14)} 暗号化: 有効
                  </div>
                  <p style="font-size: 10.5px; color: var(--muted); line-height: 1.45; margin-top: 4px;">
                    AES-GCM-256 / PBKDF2<br />データは端末から出ません
                  </p>
                </div>

                <button class="btn btn-soft" id="sidebar-lock-btn" style="width: 100%;" ${canLock ? "" : "disabled"} title="${canLock ? "保管庫をロック" : "マスターパスワードを設定している場合のみロックできます"}">
                  ${icon(canLock ? "lock" : "lockOpen", 15)} ロック
                </button>
              </div>
            </aside>

            <!-- Main Content Area -->
            <div class="main-content">
              <header class="header-bar">
                <div style="width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex-shrink: 0;" class="md-hidden">
                  ${icon("logo", 18, 1.8)}
                </div>

                <h1 style="font-size: 17px; font-weight: 800; display: none;" class="md-block">
                  ${state.screen === "list" ? "保管庫" : "設定"}
                </h1>

                ${
                  state.screen === "list"
                    ? `
                  <div style="position: relative; flex: 1; min-width: 0; max-width: 420px; margin-left: 4px;">
                    <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; display: flex;">
                      ${icon("search", 15)}
                    </span>
                    <input type="text" id="search-input" class="input-text" style="padding-left: 34px; height: 36px;" placeholder="サイト・メール・メモを検索…" value="${escapeHtml(state.query)}" />
                  </div>
                `
                    : `
                  <h1 style="font-size: 16px; font-weight: 800;" class="md-hidden">設定</h1>
                `
                }

                <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                  <button class="icon-btn md-hidden" id="mobile-lock-btn" ${canLock ? "" : "disabled"} title="${canLock ? "ロック" : "マスターパスワードを設定している場合のみロックできます"}">
                    ${icon(canLock ? "lock" : "lockOpen", 16)}
                  </button>
                </div>
              </header>

              <main class="content-area">
                ${state.screen === "settings" ? renderSettingsContent() : renderListContent(entries, sortMode, sortDir)}
              </main>
            </div>
          </div>

          <!-- Session Style Circular FAB (+) -->
          ${
            state.screen === "list"
              ? `
            <button class="fab-btn" id="fab-add-btn" aria-label="新規追加" title="新規追加">
              <span class="fab-ping"></span>
              ${icon("plus", 26, 2.4, "relative")}
            </button>
          `
              : ""
          }

          <!-- Mobile Tab Bar -->
          <nav class="mobile-nav">
            <button class="mobile-nav-btn ${state.screen === "list" ? "active" : ""}" id="tab-btn-list">
              ${icon("key", 19)}
              <span>保管庫</span>
            </button>
            <button class="mobile-nav-btn ${state.screen === "settings" ? "active" : ""}" id="tab-btn-settings">
              ${icon("settings", 19)}
              <span>設定</span>
            </button>
          </nav>

          <!-- Modals & Dialogs -->
          ${renderActiveModals()}

          <!-- Toast -->
          ${
            state.toastMsg
              ? `
            <div class="toast-box anim-toast">
              <span style="color: var(--accent); display: flex;">${icon("check", 15)}</span>
              <span>${escapeHtml(state.toastMsg)}</span>
            </div>
          `
              : ""
          }
        `;

        bindMainEvents();
      }

      function renderListContent(entries, sortMode, sortDir) {
        const sortLabels = { updated: "更新順", title: "名前順", oldest: "古い順" };

        return `
          <div class="anim-fade-up">
            <!-- Inline Header Row: "保管庫 ○ 件のデータ" + "並び替え ∨ + ↑↓" on the SAME row -->
            <div style="position: relative; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; ${state.sortOpen ? "z-index: 100;" : ""}">
              <div style="display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1;">
                <h2 style="font-size: 14.5px; font-weight: 800; color: var(--text); flex-shrink: 0;" class="md-hidden">保管庫</h2>
                <span style="font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                  ${state.query ? `「${escapeHtml(state.query)}」${entries.length}件` : `${state.data.entries.length} 件のデータ`}
                </span>
              </div>

              <!-- Sort controls on the top right -->
              <div style="display: flex; align-items: center; gap: 4px; flex-shrink: 0;">
                <div style="position: relative;">
                  <button id="sort-dropdown-btn" class="btn btn-soft" style="padding: 5px 10px; font-size: 11.5px; height: 30px; display: flex; align-items: center; gap: 4px; ${state.sortOpen ? "border-color: var(--accent); color: var(--accent); background: rgba(0,247,130,0.1);" : ""}">
                    <span style="font-size: 10px; text-transform: uppercase; color: var(--muted);" class="hidden-xs">並び替え</span>
                    <span style="font-weight: 700;">${sortLabels[sortMode] || "更新順"}</span>
                    <span style="display: flex; transform: ${state.sortOpen ? "rotate(180deg)" : "none"}; transition: transform 0.2s;">
                      ${icon("chevronDown", 12)}
                    </span>
                  </button>

                  ${
                    state.sortOpen
                      ? `
                    <div id="sort-backdrop" style="position: fixed; inset: 0; z-index: 110; background: transparent;"></div>
                    <div class="anim-modal panel" style="position: absolute; right: 0; top: calc(100% + 6px); z-index: 120; width: 160px; overflow: hidden; box-shadow: 0 16px 48px rgba(0,0,0,0.5);">
                      <div style="padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted);">
                        並び替え
                      </div>
                      ${["updated", "title", "oldest"]
                        .map((m) => {
                          const active = sortMode === m;
                          return `
                          <button class="sort-opt-btn" data-sort="${m}" style="width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; font-size: 12.5px; text-align: left; transition: background 0.15s; ${active ? "color: var(--accent); font-weight: 700;" : "color: var(--text);"}">
                            <span>${sortLabels[m]}</span>
                            ${active ? icon("check", 13) : ""}
                          </button>
                        `;
                        })
                        .join("")}
                    </div>
                  `
                      : ""
                  }
                </div>

                <button class="icon-btn" id="sort-dir-btn" style="width: 30px; height: 30px;" title="現在: ${sortDir === "asc" ? "昇順 (クリックで降順に)" : "降順 (クリックで昇順に)"}">
                  ${icon(sortDir === "asc" ? "arrowUp" : "arrowDown", 13)}
                </button>
              </div>
            </div>

            <!-- List of elongated items -->
            ${
              entries.length === 0
                ? `
              <div class="panel" style="padding: 48px 20px; text-align: center; margin-top: 10px;">
                <p style="font-size: 14px; font-weight: 600; color: var(--text);">
                  ${state.query ? "一致する項目がありません" : "保管庫はまだ空です"}
                </p>
                <p style="font-size: 12px; color: var(--muted); margin-top: 4px;">
                  ${state.query ? "別のキーワードで試してください" : "画面右下の ＋ ボタンから最初のデータを暗号化して保存しましょう"}
                </p>
              </div>
            `
                : `
              <div style="display: flex; flex-direction: column;">
                ${entries.map((e) => renderEntryRow(e)).join("")}
              </div>
            `
            }
          </div>
        `;
      }

      function renderEntryRow(e) {
        const cached = state.totpCache[e.id];
        const totpCode = cached ? `${cached.code.slice(0, 3)} ${cached.code.slice(3)}` : "------";
        const totpSec = cached ? `${cached.remaining}s` : "";

        return `
          <div class="panel entry-row" data-id="${e.id}">
            <div class="entry-indicator"></div>
            <div class="entry-grid">
              <!-- Site Title / Sub text (click to view detail) -->
              <button class="entry-title-btn" data-action="view" data-id="${e.id}">
                <div style="display: flex; align-items: center; gap: 6px;">
                  <span class="entry-title-text">${highlight(e.title, state.query)}</span>
                  ${e.favorite ? `<span style="color: var(--accent); display: flex;">${icon("star", 11, 2, "fill-accent")}</span>` : ""}
                </div>
                <div class="entry-sub-text">
                  ${e.url ? highlight(e.url.replace(/^https?:\/\//, ""), state.query) : "詳細を表示"}
                </div>
              </button>

              <!-- 3 Unified Copy Boxes: Email, Username, Password (masked) -->
              <div class="entry-copies">
                <!-- Email -->
                <button class="copy-val-box ${e.email ? "active" : "disabled"}" data-action="copy" data-val="${escapeHtml(e.email)}" data-lbl="メールアドレス" ${e.email ? "" : "disabled"}>
                  <div class="copy-val-info">
                    <span class="copy-val-lbl">メール</span>
                    <span class="copy-val-text">${e.email ? highlight(e.email, state.query) : "未登録"}</span>
                  </div>
                  <span class="copy-val-icon">${icon("copy", 11)}</span>
                </button>

                <!-- Username -->
                <button class="copy-val-box ${e.username ? "active" : "disabled"}" data-action="copy" data-val="${escapeHtml(e.username)}" data-lbl="ユーザー名" ${e.username ? "" : "disabled"}>
                  <div class="copy-val-info">
                    <span class="copy-val-lbl">ユーザー名</span>
                    <span class="copy-val-text">${e.username ? highlight(e.username, state.query) : "未登録"}</span>
                  </div>
                  <span class="copy-val-icon">${icon("copy", 11)}</span>
                </button>

                <!-- Password (masked as ••••••••, copies real password) -->
                <button class="copy-val-box ${e.password ? "active" : "disabled"}" data-action="copy" data-val="${escapeHtml(e.password)}" data-lbl="パスワード" ${e.password ? "" : "disabled"}>
                  <div class="copy-val-info">
                    <span class="copy-val-lbl">パスワード</span>
                    <span class="copy-val-text" style="letter-spacing: 0.15em;">${e.password ? "••••••••" : "未登録"}</span>
                  </div>
                  <span class="copy-val-icon">${icon("copy", 11)}</span>
                </button>
              </div>

              <!-- Action buttons -->
              <div class="entry-actions">
                ${
                  e.totp && e.totp.trim()
                    ? `
                  <button class="icon-btn" style="width: auto; padding: 0 8px; font-size: 11px; font-weight: 700; color: var(--accent); background: rgba(0,247,130,0.1); border-color: rgba(0,247,130,0.3); display: flex; align-items: center; gap: 4px;" data-totp-entry="${e.id}" data-action="copy-totp" data-id="${e.id}" title="2FAコードをコピー">
                    ${icon("zap", 11)}
                    <span class="totp-code font-mono">${totpCode}</span>
                    <span class="totp-sec" style="font-size: 9px; opacity: 0.7;">${totpSec}</span>
                  </button>
                `
                    : ""
                }

                <button class="icon-btn" data-action="favorite" data-id="${e.id}" title="お気に入り" style="${e.favorite ? "color: var(--accent); border-color: rgba(0,247,130,0.4);" : ""}">
                  ${icon("star", 13, 2, e.favorite ? "fill-accent" : "")}
                </button>
                <button class="icon-btn" data-action="edit" data-id="${e.id}" title="編集">
                  ${icon("pencil", 13)}
                </button>
                <button class="icon-btn" data-action="delete" data-id="${e.id}" title="削除">
                  ${icon("trash", 13)}
                </button>
              </div>
            </div>
          </div>
        `;
      }

      function renderSettingsContent() {
        const s = state.data.settings;
        const SERVER_REPO = "https://github.com/cryptopass-selfhost/cryptopass-server";

        return `
          <div class="anim-fade-up" style="max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;">
            <!-- Master Password -->
            <div class="panel" style="padding: 18px;">
              <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <span style="color: var(--accent); display: flex; margin-top: 2px;">${icon("key", 17)}</span>
                <div>
                  <h3 style="font-size: 14px; font-weight: 700;">マスターパスワード</h3>
                  <p style="font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px;">
                    PBKDF2-SHA256 (310,000回) で導出した鍵でAES-GCM-256暗号化します。
                  </p>
                </div>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid var(--border);">
                <div>
                  <div style="font-size: 13.5px; font-weight: 600;">アプリを開くときにパスワードを要求する</div>
                  <div style="font-size: 11.5px; color: var(--muted); margin-top: 2px;">
                    オフにすると端末内のデバイス鍵で自動復号します (利便性優先)。
                  </div>
                </div>
                <input type="checkbox" id="setting-require-pw" ${s.requirePassword ? "checked" : ""} style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;" />
              </div>

              <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                  <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">新しいパスワード</div>
                  <input type="password" id="setting-new-pw1" class="input-text" placeholder="4文字以上" />
                </div>
                <div>
                  <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">確認のため再入力</div>
                  <input type="password" id="setting-new-pw2" class="input-text" placeholder="もう一度入力" />
                </div>
              </div>

              <button class="btn btn-primary" id="setting-update-pw-btn" style="margin-top: 12px;">
                ${icon("shieldCheck", 14)} パスワードを設定して再暗号化
              </button>
            </div>

            <!-- Lock and Display -->
            <div class="panel" style="padding: 18px;">
              <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <span style="color: var(--accent); display: flex; margin-top: 2px;">${icon("lock", 17)}</span>
                <div>
                  <h3 style="font-size: 14px; font-weight: 700;">ロックと表示</h3>
                </div>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0;">
                <span style="font-size: 13px;">タブを離れたら即ロック</span>
                <input type="checkbox" id="setting-lock-blur" ${s.lockOnBlur ? "checked" : ""} style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;" />
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 10px;">
                <div>
                  <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">自動ロック (分)</div>
                  <input type="number" min="0" id="setting-autolock" class="input-text" value="${s.autoLockMinutes}" />
                </div>
                <div>
                  <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">クリップボード自動消去 (秒)</div>
                  <input type="number" min="0" id="setting-clipclear" class="input-text" value="${s.clipboardClearSeconds}" />
                </div>
              </div>

              <div style="margin-top: 12px; display: flex; gap: 8px;">
                <button class="btn ${s.theme === "dark" ? "btn-primary" : "btn-soft"}" id="theme-dark-btn" style="padding: 6px 12px;">
                  ${icon("moon", 14)} ダーク
                </button>
                <button class="btn ${s.theme === "light" ? "btn-primary" : "btn-soft"}" id="theme-light-btn" style="padding: 6px 12px;">
                  ${icon("sun", 14)} ライト
                </button>
              </div>
            </div>

            <!-- Self-host Sync -->
            <div class="panel" style="padding: 18px;">
              <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                <span style="color: var(--accent); display: flex; margin-top: 2px;">${icon("globe", 17)}</span>
                <div>
                  <h3 style="font-size: 14px; font-weight: 700;">独自サーバへの保存 (E2E 同期)</h3>
                  <p style="font-size: 12px; color: var(--muted); line-height: 1.45; margin-top: 2px;">
                    サーバへ送信されるのは暗号化blobのみ。鍵は端末から出ません。
                  </p>
                </div>
              </div>

              <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border);">
                <span style="font-size: 13px;">独自サーバ同期を有効にする</span>
                <input type="checkbox" id="setting-sync-enabled" ${s.serverSyncEnabled ? "checked" : ""} style="width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer;" />
              </div>

              ${
                s.serverSyncEnabled
                  ? `
                <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 8px;">
                  <div>
                    <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">サーバ URL</div>
                    <input type="text" id="setting-server-url" class="input-text" value="${escapeHtml(s.serverUrl)}" placeholder="https://vault.example.com" />
                  </div>
                  <div>
                    <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">アクセストークン (任意)</div>
                    <input type="password" id="setting-server-token" class="input-text" value="${escapeHtml(s.serverToken)}" />
                  </div>
                  <div style="display: flex; gap: 8px; margin-top: 4px;">
                    <button class="btn btn-soft" id="sync-upload-btn">
                      ${icon("upload", 14)} アップロード
                    </button>
                    <button class="btn btn-soft" id="sync-download-btn">
                      ${icon("download", 14)} ダウンロード
                    </button>
                  </div>
                </div>
              `
                  : ""
              }

              <a href="${SERVER_REPO}" target="_blank" rel="noreferrer" class="btn btn-soft" style="margin-top: 12px; width: 100%; display: flex; justify-content: flex-start; text-decoration: none; font-size: 12.5px;">
                ${icon("github", 15)} サーバの建て方 (GitHub)
                <span style="margin-left: auto; color: var(--muted);">${icon("external", 13)}</span>
              </a>
            </div>

            <!-- Backup -->
            <div class="panel" style="padding: 18px;">
              <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <span style="color: var(--accent); display: flex; margin-top: 2px;">${icon("download", 17)}</span>
                <div>
                  <h3 style="font-size: 14px; font-weight: 700;">バックアップ</h3>
                  <p style="font-size: 12px; color: var(--muted); margin-top: 2px;">暗号化されたままの安全なファイルです。</p>
                </div>
              </div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn btn-soft" id="export-backup-btn">
                  ${icon("download", 14)} 暗号化バックアップを書き出す
                </button>
                <label class="btn btn-soft" style="cursor: pointer;">
                  ${icon("upload", 14)} バックアップを読み込む
                  <input type="file" id="import-backup-file" accept="application/json" style="display: none;" />
                </label>
              </div>
            </div>

            <!-- Delete Account -->
            <div class="panel" style="padding: 18px;">
              <div style="display: flex; gap: 10px; margin-bottom: 8px;">
                <span style="color: var(--danger); display: flex; margin-top: 2px;">${icon("alert", 17)}</span>
                <div>
                  <h3 style="font-size: 14px; font-weight: 700; color: var(--danger);">アカウントの削除</h3>
                  <p style="font-size: 12px; color: var(--muted); margin-top: 2px;">この端末に保存されたデータを完全に消去します。取り消せません。</p>
                </div>
              </div>
              <div style="margin-top: 8px;">
                <div style="font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">確認のため DELETE と入力</div>
                <input type="text" id="delete-confirm-input" class="input-text font-mono" placeholder="DELETE" />
              </div>
              <button class="btn btn-danger" id="delete-all-btn" style="margin-top: 10px;" disabled>
                ${icon("trash", 14)} すべて削除する
              </button>
            </div>

            <p style="text-align: center; font-size: 11px; color: var(--muted); line-height: 1.5; padding-bottom: 20px;">
              すべての処理はブラウザ内で完結します。サーバへ平文が送信されることはありません。<br />
              AES-GCM-256 / PBKDF2-SHA256 310,000 iterations / WebCrypto
            </p>
          </div>
        `;
      }

      function renderActiveModals() {
        let out = "";

        // Detail View Modal
        if (state.selectedEntry) {
          const e = state.selectedEntry;
          const cached = state.totpCache[e.id];
          const totpCode = cached ? `${cached.code.slice(0, 3)} ${cached.code.slice(3)}` : "------";

          out += `
            <div class="modal-backdrop" id="modal-detail-backdrop">
              <div class="modal-box anim-modal">
                <div class="modal-header">
                  <h2 style="font-size: 15px; font-weight: 800;">${escapeHtml(e.title)}</h2>
                  <button class="icon-btn" id="modal-close-btn">${icon("x", 16)}</button>
                </div>
                <div class="modal-body">
                  <div style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                      <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted);">サイト / アプリ名</div>
                      <div style="font-size: 14px; font-weight: 600; margin-top: 2px;">${escapeHtml(e.title)}</div>
                    </div>
                    ${
                      e.url
                        ? `
                      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px;">
                        <div>
                          <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted);">URL</div>
                          <div style="font-size: 13px; margin-top: 2px;">${escapeHtml(e.url)}</div>
                        </div>
                        <button class="btn btn-soft" data-action="copy" data-val="${escapeHtml(e.url)}" data-lbl="URL" style="padding: 4px 10px; font-size: 11px;">コピー</button>
                      </div>
                    `
                        : ""
                    }
                    ${
                      e.email
                        ? `
                      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px;">
                        <div>
                          <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted);">メールアドレス</div>
                          <div style="font-size: 13px; font-family: monospace; margin-top: 2px;">${escapeHtml(e.email)}</div>
                        </div>
                        <button class="btn btn-soft" data-action="copy" data-val="${escapeHtml(e.email)}" data-lbl="メールアドレス" style="padding: 4px 10px; font-size: 11px;">コピー</button>
                      </div>
                    `
                        : ""
                    }
                    ${
                      e.username
                        ? `
                      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px;">
                        <div>
                          <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted);">ユーザー名</div>
                          <div style="font-size: 13px; font-family: monospace; margin-top: 2px;">${escapeHtml(e.username)}</div>
                        </div>
                        <button class="btn btn-soft" data-action="copy" data-val="${escapeHtml(e.username)}" data-lbl="ユーザー名" style="padding: 4px 10px; font-size: 11px;">コピー</button>
                      </div>
                    `
                        : ""
                    }
                    ${
                      e.password
                        ? `
                      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px;">
                        <div>
                          <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted);">パスワード</div>
                          <div id="detail-pw-text" style="font-size: 13px; font-family: monospace; margin-top: 2px; letter-spacing: 0.1em;">••••••••</div>
                        </div>
                        <div style="display: flex; gap: 6px;">
                          <button class="btn btn-soft" id="detail-pw-toggle" style="padding: 4px 10px; font-size: 11px;">表示</button>
                          <button class="btn btn-soft" data-action="copy" data-val="${escapeHtml(e.password)}" data-lbl="パスワード" style="padding: 4px 10px; font-size: 11px;">コピー</button>
                        </div>
                      </div>
                    `
                        : ""
                    }
                    ${
                      e.totp && e.totp.trim()
                        ? `
                      <div style="border-top: 1px solid var(--border); padding-top: 10px;">
                        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">2FA ワンタイムコード</div>
                        <button class="btn btn-soft" data-action="copy-totp" data-id="${e.id}" style="font-size: 16px; font-weight: 800; color: var(--accent); letter-spacing: 0.2em; font-family: monospace;">
                          ${icon("zap", 14)} ${totpCode}
                        </button>
                      </div>
                    `
                        : ""
                    }
                    ${
                      e.note
                        ? `
                      <div style="border-top: 1px solid var(--border); padding-top: 10px;">
                        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted);">メモ</div>
                        <p style="font-size: 13px; color: var(--text); line-height: 1.5; margin-top: 4px; white-space: pre-wrap;">${escapeHtml(e.note)}</p>
                      </div>
                    `
                        : ""
                    }
                  </div>

                  <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px;">
                    <button class="btn btn-danger" id="detail-delete-btn" style="padding: 6px 12px;">
                      ${icon("trash", 13)} 削除
                    </button>
                    <button class="btn btn-primary" id="detail-edit-btn" style="padding: 6px 14px;">
                      ${icon("pencil", 13)} 編集
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        // Edit / Create Modal
        if (state.editingEntry) {
          const e = state.editingEntry;
          const isNew = !state.data.entries.some((x) => x.id === e.id);

          out += `
            <div class="modal-backdrop" id="modal-edit-backdrop">
              <div class="modal-box wide anim-modal">
                <div class="modal-header">
                  <h2 style="font-size: 15px; font-weight: 800;">${isNew ? "新しい項目を追加" : "項目を編集"}</h2>
                  <button class="icon-btn" id="modal-edit-close-btn">${icon("x", 16)}</button>
                </div>
                <div class="modal-body">
                  <form id="edit-form" style="display: flex; flex-direction: column; gap: 12px;">
                    <div>
                      <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">サイト / アプリ名 *</div>
                      <input type="text" id="edit-title" class="input-text" value="${escapeHtml(e.title)}" placeholder="例: GitHub" required autofocus />
                    </div>
                    <div>
                      <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">URL (任意)</div>
                      <input type="text" id="edit-url" class="input-text" value="${escapeHtml(e.url)}" placeholder="https://" />
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                      <div>
                        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">メールアドレス</div>
                        <input type="email" id="edit-email" class="input-text" value="${escapeHtml(e.email)}" placeholder="you@example.com" />
                      </div>
                      <div>
                        <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">ユーザー名</div>
                        <input type="text" id="edit-username" class="input-text" value="${escapeHtml(e.username)}" />
                      </div>
                    </div>
                    <div>
                      <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">パスワード</div>
                      <div style="display: flex; gap: 6px;">
                        <input type="password" id="edit-pw" class="input-text font-mono" value="${escapeHtml(e.password)}" />
                        <button type="button" class="icon-btn" id="edit-pw-toggle" title="表示切替">${icon("eye", 15)}</button>
                        <button type="button" class="icon-btn" id="edit-pw-gen" title="パスワード生成">${icon("refresh", 15)}</button>
                      </div>
                    </div>
                    <div>
                      <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">2FA シークレット (Base32 または otpauth://)</div>
                      <input type="text" id="edit-totp" class="input-text font-mono" value="${escapeHtml(e.totp)}" placeholder="JBSWY3DPEHPK3PXP" />
                    </div>
                    <div>
                      <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 4px;">メモ</div>
                      <textarea id="edit-note" class="input-text" style="min-height: 80px; resize: vertical;">${escapeHtml(e.note)}</textarea>
                    </div>

                    <div style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 8px;">
                      <button type="button" class="btn btn-ghost" id="edit-cancel-btn">キャンセル</button>
                      <button type="submit" class="btn btn-primary">${icon("check", 14)} 保存</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          `;
        }

        // In-app Confirm Dialog
        if (state.confirmDialog) {
          const c = state.confirmDialog;
          out += `
            <div class="modal-backdrop" id="modal-confirm-backdrop" style="z-index: 200;">
              <div class="modal-box anim-modal" style="max-width: 440px;">
                <div class="modal-header">
                  <h2 style="font-size: 15px; font-weight: 800;">${escapeHtml(c.title)}</h2>
                  <button class="icon-btn" id="confirm-close-btn">${icon("x", 16)}</button>
                </div>
                <div class="modal-body" style="display: flex; flex-direction: column; gap: 16px;">
                  <div style="display: flex; gap: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg2); padding: 14px;">
                    <div style="color: ${c.danger ? "var(--danger)" : "var(--accent)"}; flex-shrink: 0; margin-top: 2px;">
                      ${icon(c.danger ? "alert" : "shieldCheck", 18)}
                    </div>
                    <p style="font-size: 13px; color: var(--text); line-height: 1.5;">${escapeHtml(c.message)}</p>
                  </div>
                  <div style="display: flex; justify-content: flex-end; gap: 8px;">
                    <button class="btn btn-ghost" id="confirm-cancel-btn">${escapeHtml(c.cancelLabel || "キャンセル")}</button>
                    <button class="btn ${c.danger ? "btn-danger" : "btn-primary"}" id="confirm-ok-btn">
                      ${icon(c.danger ? "trash" : "check", 14)} ${escapeHtml(c.confirmLabel || "確認")}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        return out;
      }

      function bindMainEvents() {
        // Navigation buttons
        const btnList = document.getElementById("nav-btn-list");
        const btnSettings = document.getElementById("nav-btn-settings");
        const tabList = document.getElementById("tab-btn-list");
        const tabSettings = document.getElementById("tab-btn-settings");

        const goList = () => {
          state.screen = "list";
          window.scrollTo(0, 0);
          render();
        };
        const goSettings = () => {
          state.screen = "settings";
          window.scrollTo(0, 0);
          render();
        };

        if (btnList) btnList.onclick = goList;
        if (btnSettings) btnSettings.onclick = goSettings;
        if (tabList) tabList.onclick = goList;
        if (tabSettings) tabSettings.onclick = goSettings;

        // Search input
        const searchInput = document.getElementById("search-input");
        if (searchInput) {
          searchInput.oninput = (e) => {
            state.query = e.target.value;
            render();
            // keep focus at end of input
            const fresh = document.getElementById("search-input");
            if (fresh) {
              fresh.focus();
              fresh.setSelectionRange(fresh.value.length, fresh.value.length);
            }
          };
        }

        // Locks
        const sbLock = document.getElementById("sidebar-lock-btn");
        const mbLock = document.getElementById("mobile-lock-btn");
        if (sbLock) sbLock.onclick = lock;
        if (mbLock) mbLock.onclick = lock;

        // FAB (+)
        const fab = document.getElementById("fab-add-btn");
        if (fab) {
          fab.onclick = () => {
            state.editingEntry = {
              id: uid(),
              title: "",
              url: "",
              email: "",
              username: "",
              password: "",
              totp: "",
              note: "",
              createdAt: Date.now(),
              updatedAt: Date.now()
            };
            render();
          };
        }

        // Sort Dropdown
        const sortBtn = document.getElementById("sort-dropdown-btn");
        const sortBackdrop = document.getElementById("sort-backdrop");
        const sortDirBtn = document.getElementById("sort-dir-btn");

        if (sortBtn) {
          sortBtn.onclick = () => {
            state.sortOpen = !state.sortOpen;
            render();
          };
        }
        if (sortBackdrop) {
          sortBackdrop.onclick = () => {
            state.sortOpen = false;
            render();
          };
        }
        if (sortDirBtn) {
          sortDirBtn.onclick = () => {
            const nextDir = (state.data.settings.sortDir || "desc") === "asc" ? "desc" : "asc";
            saveVault({ ...state.data, settings: { ...state.data.settings, sortDir: nextDir } });
          };
        }
        document.querySelectorAll(".sort-opt-btn").forEach((btn) => {
          btn.onclick = () => {
            const m = btn.getAttribute("data-sort");
            const defaultDirs = { updated: "desc", oldest: "asc", title: "asc" };
            state.sortOpen = false;
            saveVault({
              ...state.data,
              settings: { ...state.data.settings, sortOrder: m, sortDir: defaultDirs[m] }
            });
          };
        });

        // Entry clicks & copies (delegation)
        appEl.onclick = async (e) => {
          const btn = e.target.closest("button");
          if (!btn) return;
          const action = btn.getAttribute("data-action");
          if (!action) return;

          e.stopPropagation();

          if (action === "copy") {
            const val = btn.getAttribute("data-val");
            const lbl = btn.getAttribute("data-lbl");
            await copyText(val, lbl);
          } else if (action === "copy-totp") {
            const id = btn.getAttribute("data-id");
            const entry = state.data.entries.find((x) => x.id === id);
            if (entry) {
              const code = await computeTotp(entry.totp);
              await copyText(code, "2FAコード");
            }
          } else if (action === "view") {
            const id = btn.getAttribute("data-id");
            state.selectedEntry = state.data.entries.find((x) => x.id === id);
            render();
          } else if (action === "favorite") {
            const id = btn.getAttribute("data-id");
            saveVault({
              ...state.data,
              entries: state.data.entries.map((x) => (x.id === id ? { ...x, favorite: !x.favorite } : x))
            });
          } else if (action === "edit") {
            const id = btn.getAttribute("data-id");
            state.editingEntry = { ...state.data.entries.find((x) => x.id === id) };
            state.selectedEntry = null;
            render();
          } else if (action === "delete") {
            const id = btn.getAttribute("data-id");
            const target = state.data.entries.find((x) => x.id === id);
            if (!target) return;
            confirmAction({
              title: "項目を削除する",
              message: `「${target.title}」を削除しますか?この操作は取り消せません。`,
              confirmLabel: "削除する",
              danger: true,
              onConfirm: () => {
                saveVault({
                  ...state.data,
                  entries: state.data.entries.filter((x) => x.id !== id)
                });
                showToast("削除しました");
              }
            });
          }
        };

        // Detail Modal Events
        const detailClose = document.getElementById("modal-close-btn");
        const detailBackdrop = document.getElementById("modal-detail-backdrop");
        if (detailClose) detailClose.onclick = () => { state.selectedEntry = null; render(); };
        if (detailBackdrop) {
          detailBackdrop.onclick = (e) => {
            if (e.target === detailBackdrop) { state.selectedEntry = null; render(); }
          };
        }
        const detailPwToggle = document.getElementById("detail-pw-toggle");
        if (detailPwToggle && state.selectedEntry) {
          let revealed = false;
          detailPwToggle.onclick = () => {
            revealed = !revealed;
            const el = document.getElementById("detail-pw-text");
            if (el) el.textContent = revealed ? state.selectedEntry.password : "••••••••";
            detailPwToggle.textContent = revealed ? "隠す" : "表示";
          };
        }
        const detailEditBtn = document.getElementById("detail-edit-btn");
        if (detailEditBtn && state.selectedEntry) {
          detailEditBtn.onclick = () => {
            state.editingEntry = { ...state.selectedEntry };
            state.selectedEntry = null;
            render();
          };
        }
        const detailDeleteBtn = document.getElementById("detail-delete-btn");
        if (detailDeleteBtn && state.selectedEntry) {
          detailDeleteBtn.onclick = () => {
            const target = state.selectedEntry;
            confirmAction({
              title: "項目を削除する",
              message: `「${target.title}」を削除しますか?この操作は取り消せません。`,
              confirmLabel: "削除する",
              danger: true,
              onConfirm: () => {
                saveVault({
                  ...state.data,
                  entries: state.data.entries.filter((x) => x.id !== target.id)
                });
                state.selectedEntry = null;
                showToast("削除しました");
              }
            });
          };
        }

        // Edit Modal Events
        const editClose = document.getElementById("modal-edit-close-btn");
        const editCancel = document.getElementById("edit-cancel-btn");
        const editBackdrop = document.getElementById("modal-edit-backdrop");
        const closeEdit = () => { state.editingEntry = null; render(); };
        if (editClose) editClose.onclick = closeEdit;
        if (editCancel) editCancel.onclick = closeEdit;
        if (editBackdrop) {
          editBackdrop.onclick = (e) => { if (e.target === editBackdrop) closeEdit(); };
        }
        const editPwToggle = document.getElementById("edit-pw-toggle");
        const editPw = document.getElementById("edit-pw");
        if (editPwToggle && editPw) {
          editPwToggle.onclick = () => {
            const isPw = editPw.type === "password";
            editPw.type = isPw ? "text" : "password";
            editPwToggle.innerHTML = icon(isPw ? "eyeOff" : "eye", 15);
          };
        }
        const editPwGen = document.getElementById("edit-pw-gen");
        if (editPwGen && editPw) {
          editPwGen.onclick = () => {
            editPw.value = generatePassword(20);
          };
        }
        const editForm = document.getElementById("edit-form");
        if (editForm) {
          editForm.onsubmit = (e) => {
            e.preventDefault();
            const id = state.editingEntry.id;
            const isNew = !state.data.entries.some((x) => x.id === id);
            const entry = {
              id,
              title: document.getElementById("edit-title").value.trim(),
              url: document.getElementById("edit-url").value.trim(),
              email: document.getElementById("edit-email").value.trim(),
              username: document.getElementById("edit-username").value.trim(),
              password: document.getElementById("edit-pw").value,
              totp: document.getElementById("edit-totp").value.trim(),
              note: document.getElementById("edit-note").value,
              favorite: state.editingEntry.favorite || false,
              createdAt: state.editingEntry.createdAt || Date.now(),
              updatedAt: Date.now()
            };
            const nextEntries = isNew
              ? [entry, ...state.data.entries]
              : state.data.entries.map((x) => (x.id === id ? entry : x));
            state.editingEntry = null;
            saveVault({ ...state.data, entries: nextEntries });
            showToast(isNew ? "追加しました" : "保存しました");
          };
        }

        // Confirm Dialog Events
        const confirmClose = document.getElementById("confirm-close-btn");
        const confirmCancel = document.getElementById("confirm-cancel-btn");
        const confirmBackdrop = document.getElementById("modal-confirm-backdrop");
        const confirmOk = document.getElementById("confirm-ok-btn");
        const closeConfirm = () => { state.confirmDialog = null; render(); };

        if (confirmClose) confirmClose.onclick = closeConfirm;
        if (confirmCancel) confirmCancel.onclick = closeConfirm;
        if (confirmBackdrop) {
          confirmBackdrop.onclick = (e) => { if (e.target === confirmBackdrop) closeConfirm(); };
        }
        if (confirmOk && state.confirmDialog) {
          confirmOk.onclick = async () => {
            const fn = state.confirmDialog.onConfirm;
            state.confirmDialog = null;
            render();
            if (fn) await fn();
          };
        }

        // Settings page events
        if (state.screen === "settings") {
          const reqPwCheck = document.getElementById("setting-require-pw");
          if (reqPwCheck) {
            reqPwCheck.onchange = () => {
              if (!reqPwCheck.checked) {
                confirmAction({
                  title: "パスワード要求をオフにする",
                  message: "パスワード要求をオフにすると、端末内のデバイス鍵で自動復号されます。安全性が低下しますが設定を変更しますか?",
                  confirmLabel: "オフにする",
                  danger: true,
                  onConfirm: async () => {
                    await rekeyVault(null);
                    showToast("パスワード要求をオフにしました");
                  }
                });
                reqPwCheck.checked = true; // revert until confirmed
              } else {
                showToast("下のフォームから新しいパスワードを設定してください");
                reqPwCheck.checked = false;
              }
            };
          }

          const updatePwBtn = document.getElementById("setting-update-pw-btn");
          if (updatePwBtn) {
            updatePwBtn.onclick = async () => {
              const p1 = document.getElementById("setting-new-pw1").value;
              const p2 = document.getElementById("setting-new-pw2").value;
              if (p1.length < 4 || p1 !== p2) {
                showToast("パスワードが一致しないか4文字未満です");
                return;
              }
              updatePwBtn.disabled = true;
              updatePwBtn.innerHTML = `${icon("refresh", 14)} 再暗号化中…`;
              await rekeyVault(p1);
              showToast("マスターパスワードを更新しました");
            };
          }

          const lockBlur = document.getElementById("setting-lock-blur");
          if (lockBlur) {
            lockBlur.onchange = () => {
              saveVault({ ...state.data, settings: { ...state.data.settings, lockOnBlur: lockBlur.checked } });
            };
          }

          const autoLockInput = document.getElementById("setting-autolock");
          if (autoLockInput) {
            autoLockInput.onchange = () => {
              saveVault({ ...state.data, settings: { ...state.data.settings, autoLockMinutes: Number(autoLockInput.value) || 0 } });
            };
          }

          const clipClearInput = document.getElementById("setting-clipclear");
          if (clipClearInput) {
            clipClearInput.onchange = () => {
              saveVault({ ...state.data, settings: { ...state.data.settings, clipboardClearSeconds: Number(clipClearInput.value) || 0 } });
            };
          }

          const themeDark = document.getElementById("theme-dark-btn");
          const themeLight = document.getElementById("theme-light-btn");
          if (themeDark) {
            themeDark.onclick = () => saveVault({ ...state.data, settings: { ...state.data.settings, theme: "dark" } });
          }
          if (themeLight) {
            themeLight.onclick = () => saveVault({ ...state.data, settings: { ...state.data.settings, theme: "light" } });
          }

          const syncEnabled = document.getElementById("setting-sync-enabled");
          if (syncEnabled) {
            syncEnabled.onchange = () => {
              saveVault({ ...state.data, settings: { ...state.data.settings, serverSyncEnabled: syncEnabled.checked } });
            };
          }

          const serverUrl = document.getElementById("setting-server-url");
          if (serverUrl) {
            serverUrl.onchange = () => {
              saveVault({ ...state.data, settings: { ...state.data.settings, serverUrl: serverUrl.value } });
            };
          }

          const serverToken = document.getElementById("setting-server-token");
          if (serverToken) {
            serverToken.onchange = () => {
              saveVault({ ...state.data, settings: { ...state.data.settings, serverToken: serverToken.value } });
            };
          }

          const uploadBtn = document.getElementById("sync-upload-btn");
          if (uploadBtn) {
            uploadBtn.onclick = async () => {
              try {
                const raw = loadRaw();
                const res = await fetch(state.data.settings.serverUrl.replace(/\/$/, "") + "/vault", {
                  method: "PUT",
                  headers: {
                    "Content-Type": "application/json",
                    ...(state.data.settings.serverToken ? { Authorization: `Bearer ${state.data.settings.serverToken}` } : {})
                  },
                  body: JSON.stringify({ salt: raw.salt, iterations: raw.iterations, payload: raw.payload })
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                showToast("サーバへアップロードしました");
              } catch (err) {
                showToast("アップロード失敗: " + err.message);
              }
            };
          }

          const downloadBtn = document.getElementById("sync-download-btn");
          if (downloadBtn) {
            downloadBtn.onclick = async () => {
              try {
                const res = await fetch(state.data.settings.serverUrl.replace(/\/$/, "") + "/vault", {
                  headers: state.data.settings.serverToken ? { Authorization: `Bearer ${state.data.settings.serverToken}` } : {}
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const body = await res.json();
                const raw = loadRaw();
                saveRaw({ ...raw, salt: body.salt, iterations: body.iterations, payload: body.payload });
                showToast("ダウンロード完了。再ロック後に反映されます");
              } catch (err) {
                showToast("ダウンロード失敗: " + err.message);
              }
            };
          }

          const exportBtn = document.getElementById("export-backup-btn");
          if (exportBtn) {
            exportBtn.onclick = () => {
              const raw = loadRaw();
              const blob = new Blob([JSON.stringify(raw, null, 2)], { type: "application/json" });
              const a = document.createElement("a");
              a.href = URL.createObjectURL(blob);
              a.download = `cryptopass-backup-${new Date().toISOString().slice(0, 10)}.json`;
              a.click();
              showToast("暗号化バックアップを書き出しました");
            };
          }

          const importInput = document.getElementById("import-backup-file");
          if (importInput) {
            importInput.onchange = async (e) => {
              const file = e.target.files?.[0];
              if (!file) return;
              try {
                const parsed = JSON.parse(await file.text());
                if (!parsed?.payload?.ct) throw new Error("形式が不正です");
                saveRaw(parsed);
                showToast("読み込みました。ロック解除し直してください");
                lock();
              } catch (err) {
                showToast("読み込み失敗: " + err.message);
              }
            };
          }

          const deleteInput = document.getElementById("delete-confirm-input");
          const deleteAllBtn = document.getElementById("delete-all-btn");
          if (deleteInput && deleteAllBtn) {
            deleteInput.oninput = () => {
              deleteAllBtn.disabled = deleteInput.value !== "DELETE";
            };
            deleteAllBtn.onclick = () => {
              confirmAction({
                title: "アカウントのデータを削除する",
                message: "この端末に保存された暗号化データと設定をすべて完全に削除します。バックアップがない場合は復元できません。この操作は取り消せません。",
                confirmLabel: "すべて削除する",
                danger: true,
                onConfirm: () => {
                  wipeVault();
                  state.hasVault = false;
                  lock();
                }
              });
            };
          }
        }
      }

      const style = document.createElement("style");
      style.textContent = `
        @media (min-width: 768px) {
          .md-hidden { display: none !important; }
          .md-block { display: block !important; }
        }
        @media (max-width: 480px) {
          .hidden-xs { display: none !important; }
        }
      `;
      document.head.appendChild(style);
      render();
    </script>
  </body>
</html>
