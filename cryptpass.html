<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta id="theme-color" name="theme-color" content="#f2f2f7">
  <title>Crypt Pass</title>
  <link rel="icon" href="cryptpass.png">
  <link rel="apple-touch-icon" href="https://l8.f5.si/cryptpass.png">
  <meta name="apple-mobile-web-app-title" content="CryptPass">
    <style>
      :root {
        --bg: #0c0f12;
        --bg2: #101418;
        --panel: #151a20;
        --panel2: #1b222b;
        --border: #232c37;
        --text: #e7edf3;
        --muted: #77879a;
        --accent: #00f782;
        --accent-ink: #03140b;
        --danger: #ff5c57;
        --glow: rgba(0, 247, 130, 0.16);
        --gridline: rgba(0, 247, 130, 0.045);
        --fab-bottom: 84px;
        color-scheme: dark;
      }
      .theme-light {
        --bg: #f1f4f3;
        --bg2: #e8edeb;
        --panel: #ffffff;
        --panel2: #f4f7f6;
        --border: #d8e0dd;
        --text: #12211b;
        --muted: #5c7269;
        --accent: #00b864;
        --accent-ink: #ffffff;
        --danger: #e5484d;
        --glow: rgba(0, 184, 100, 0.16);
        --gridline: rgba(0, 184, 100, 0.06);
        color-scheme: light;
      }
      @media (min-width: 768px) {
        :root {
          --fab-bottom: 32px;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        height: 100%;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
      }
      body {
        min-height: 100%;
        margin: 0;
        overflow-x: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.5;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      ::selection {
        background: var(--accent);
        color: var(--accent-ink);
      }
      input, textarea, select, button {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: none;
        cursor: pointer;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 99px;
      }

      .ambient-grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: linear-gradient(to right, var(--gridline) 1px, transparent 1px),
          linear-gradient(to bottom, var(--gridline) 1px, transparent 1px);
        background-size: 38px 38px;
        mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, black 15%, transparent 80%);
        -webkit-mask-image: radial-gradient(ellipse 95% 75% at 50% 0%, black 15%, transparent 80%);
        z-index: 0;
      }
      .ambient-glow {
        position: fixed;
        top: -180px;
        left: 50%;
        width: 720px;
        height: 440px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: var(--accent);
        opacity: 0.06;
        filter: blur(120px);
        pointer-events: none;
        z-index: 0;
        animation: glowBreathe 7s ease-in-out infinite;
      }

      @keyframes glowBreathe {
        0%, 100% { opacity: 0.05; transform: translateX(-50%) scale(1); }
        50% { opacity: 0.09; transform: translateX(-50%) scale(1.08); }
      }
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes modalPop {
        from { opacity: 0; transform: translateY(14px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pingSoft {
        0% { transform: scale(1); opacity: 0.55; }
        70%, 100% { transform: scale(1.55); opacity: 0; }
      }
      @keyframes toastIn {
        from { opacity: 0; transform: translate(-50%, 14px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

      .anim-fade-up {
        animation: fadeUp 0.3s cubic-bezier(0.22, 0.68, 0.31, 1) both;
      }
      .anim-modal {
        animation: modalPop 0.25s cubic-bezier(0.22, 0.68, 0.31, 1) both;
      }
      .anim-toast {
        animation: toastIn 0.25s cubic-bezier(0.22, 0.68, 0.31, 1) both;
      }

      mark.hl {
        background: rgba(0, 247, 130, 0.24);
        color: var(--accent);
        font-weight: 700;
        padding: 0 1px;
        border-radius: 3px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .input-text {
        width: 100%;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg2);
        padding: 9px 12px;
        font-size: 13.5px;
        color: var(--text);
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .input-text:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--glow);
      }
      .input-text::placeholder {
        color: var(--muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        padding: 8px 14px;
        transition: all 0.15s ease;
        user-select: none;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .btn-primary:hover:not(:disabled) {
        filter: brightness(1.1);
        box-shadow: 0 4px 20px var(--glow);
      }
      .btn-soft {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
      }
      .btn-soft:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .btn-ghost {
        color: var(--muted);
      }
      .btn-ghost:hover:not(:disabled) {
        color: var(--text);
        background: var(--panel2);
      }
      .btn-danger {
        background: rgba(255, 92, 87, 0.12);
        color: var(--danger);
        border: 1px solid rgba(255, 92, 87, 0.4);
      }
      .btn-danger:hover:not(:disabled) {
        background: rgba(255, 92, 87, 0.22);
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        display: inline-grid;
        place-items: center;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--muted);
        transition: all 0.15s;
        flex-shrink: 0;
      }
      .icon-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      .icon-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .copy-val-box {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        min-width: 0;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg2);
        padding: 0 8px;
        text-align: left;
        transition: border-color 0.15s, transform 0.1s;
      }
      .copy-val-box.active {
        cursor: pointer;
      }
      .copy-val-box.active:hover {
        border-color: var(--accent);
      }
      .copy-val-box.active:hover .copy-val-text {
        color: var(--accent);
      }
      .copy-val-box.active:hover .copy-val-icon {
        color: var(--accent);
      }
      .copy-val-box.active:active {
        transform: scale(0.98);
      }
      .copy-val-box.disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .copy-val-info {
        flex: 1;
        min-width: 0;
      }
      .copy-val-lbl {
        display: block;
        font-size: 8.5px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        line-height: 1;
      }
      .copy-val-text {
        display: block;
        font-size: 11px;
        font-family: ui-monospace, Menlo, Monaco, Consolas, monospace;
        line-height: 1.2;
        margin-top: 2px;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.15s;
      }
      .copy-val-icon {
        color: var(--muted);
        flex-shrink: 0;
        transition: color 0.15s;
      }

      #app {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-layout {
        display: flex;
        min-height: 100vh;
        width: 100%;
      }
      .sidebar {
        display: none;
        width: 256px;
        flex-shrink: 0;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: rgba(16, 20, 24, 0.85);
        backdrop-filter: blur(12px);
        flex-direction: column;
        padding: 24px 16px 16px;
      }
      @media (min-width: 768px) {
        .sidebar {
          display: flex;
        }
      }

      .main-content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .header-bar {
        position: sticky;
        top: 0;
        z-index: 30;
        background: rgba(12, 15, 18, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      @media (min-width: 768px) {
        .header-bar {
          padding: 10px 24px;
        }
      }

      .content-area {
        max-width: 1024px;
        width: 100%;
        margin: 0 auto;
        flex: 1;
        padding: 6px 12px 110px;
      }
      @media (min-width: 768px) {
        .content-area {
          padding: 10px 24px 32px;
        }
      }

      .fab-btn {
        position: fixed;
        left: 50%;
        bottom: calc(env(safe-area-inset-bottom, 0px) + var(--fab-bottom));
        transform: translateX(-50%);
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-items: center;
        box-shadow: 0 8px 32px var(--glow), 0 4px 16px rgba(0,0,0,0.4);
        z-index: 40;
        transition: transform 0.2s, filter 0.2s;
      }
      .fab-btn:hover {
        transform: translateX(-50%) scale(1.06);
        filter: brightness(1.1);
      }
      .fab-btn:active {
        transform: translateX(-50%) scale(0.95);
      }
      .fab-ping {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: rgba(0, 247, 130, 0.35);
        pointer-events: none;
        animation: pingSoft 2.6s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @media (min-width: 768px) {
        .fab-btn {
          left: auto;
          right: 32px;
          transform: none;
        }
        .fab-btn:hover {
          transform: scale(1.06);
        }
        .fab-btn:active {
          transform: scale(0.95);
        }
      }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 30;
        background: rgba(16, 20, 24, 0.92);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
        display: flex;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (min-width: 768px) {
        .mobile-nav {
          display: none;
        }
      }
      .mobile-nav-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 9px 0;
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
        transition: color 0.15s;
      }
      .mobile-nav-btn.active {
        color: var(--accent);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: flex-end;
        justify-content: center;
        padding: 0;
      }
      @media (min-width: 640px) {
        .modal-backdrop {
          align-items: center;
          padding: 24px;
        }
      }
      .modal-box {
        width: 100%;
        max-width: 540px;
        max-height: 90vh;
        background: var(--panel);
        border: 1px solid var(--border);
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      }
      @media (min-width: 640px) {
        .modal-box {
          border-radius: 16px;
        }
      }
      .modal-box.wide {
        max-width: 760px;
      }
      .modal-header {
        padding: 14px 18px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .modal-body {
        padding: 16px 18px calc(env(safe-area-inset-bottom, 0px) + 20px);
        overflow-y: auto;
      }

      .toast-box {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 150;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 12px 36px rgba(0,0,0,0.5);
        font-size: 13px;
        white-space: nowrap;
        max-width: calc(100vw - 32px);
      }

      .entry-row {
        position: relative;
        overflow: hidden;
        transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      @media (min-width: 640px) {
        .entry-row {
          padding: 10px 14px;
        }
      }
      .entry-row:hover {
        border-color: var(--accent);
        box-shadow: 0 8px 28px var(--glow);
      }
      .entry-indicator {
        position: absolute;
        inset-block: 0;
        left: 0;
        width: 3px;
        background: var(--accent);
        opacity: 0;
        transition: opacity 0.15s;
      }
      .entry-row:hover .entry-indicator {
        opacity: 1;
      }

      .entry-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 8px;
      }
      @media (min-width: 1024px) {
        .entry-grid {
          display: flex;
          align-items: center;
          gap: 10px;
        }
      }
      .entry-title-btn {
        display: flex;
        flex-direction: column;
        text-align: left;
        min-width: 0;
      }
      @media (min-width: 1024px) {
        .entry-title-btn {
          width: 170px;
          flex-shrink: 0;
        }
      }
      .entry-title-text {
        font-size: 13.5px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.15s;
      }
      .entry-row:hover .entry-title-text {
        color: var(--accent);
      }
      .entry-sub-text {
        font-size: 10px;
        color: var(--muted);
        line-height: 1;
        margin-top: 3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .entry-copies {
        grid-column: span 2;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      @media (min-width: 1024px) {
        .entry-copies {
          display: flex;
          flex: 1;
          min-width: 0;
        }
      }
      .entry-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="ambient-grid"></div>
    <div class="ambient-glow"></div>

    <div id="app"></div>

    <script>
      const enc = new TextEncoder();
      const dec = new TextDecoder();

      const b64 = (buf) => {
        const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
        let s = "";
        bytes.forEach((b) => (s += String.fromCharCode(b)));
        return btoa(s);
      };

      const unb64 = (s) => {
        const bin = atob(s);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
      };

      const randomBytes = (n) => crypto.getRandomValues(new Uint8Array(n));

      async function deriveKey(password, salt, iterations = 310000) {
        const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
          base,
          { name: "AES-GCM", length: 256 },
          false,
          ["encrypt", "decrypt"]
        );
      }

      async function encryptJSON(key, data) {
        const iv = randomBytes(12);
        const ct = await crypto.subtle.encrypt(
          { name: "AES-GCM", iv },
          key,
          enc.encode(JSON.stringify(data))
        );
        return { iv: b64(iv), ct: b64(ct) };
      }

      async function decryptJSON(key, payload) {
        const pt = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: unb64(payload.iv) },
          key,
          unb64(payload.ct)
        );
        return JSON.parse(dec.decode(pt));
      }

      function generatePassword(len = 20) {
        const pool = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+[]{}";
        const rnd = crypto.getRandomValues(new Uint32Array(len));
        let out = "";
        for (let i = 0; i < len; i++) out += pool[rnd[i] % pool.length];
        return out;
      }

      function base32Decode(input) {
        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
        const clean = (input || "").replace(/=+$/, "").replace(/\s/g, "").toUpperCase();
        let bits = 0, value = 0;
        const out = [];
        for (const c of clean) {
          const idx = alphabet.indexOf(c);
          if (idx === -1) continue;
          value = (value << 5) | idx;
          bits += 5;
          if (bits >= 8) {
            out.push((value >>> (bits - 8)) & 0xff);
            bits -= 8;
          }
        }
        return new Uint8Array(out);
      }

      function parseTotpSecret(raw) {
        const s = (raw || "").trim();
        if (s.toLowerCase().startsWith("otpauth://")) {
          try {
            const u = new URL(s);
            return u.searchParams.get("secret") || "";
          } catch {
            return "";
          }
        }
        return s;
      }

      async function computeTotp(secret, period = 30, digits = 6) {
        const key = base32Decode(parseTotpSecret(secret));
        if (!key.length) return "------";
        const counter = Math.floor(Date.now() / 1000 / period);
        const buf = new ArrayBuffer(8);
        const view = new DataView(buf);
        view.setUint32(0, Math.floor(counter / 2 ** 32));
        view.setUint32(4, counter >>> 0);
        const ck = await crypto.subtle.importKey(
          "raw",
          key,
          { name: "HMAC", hash: "SHA-1" },
          false,
          ["sign"]
        );
        const sig = new Uint8Array(await crypto.subtle.sign("HMAC", ck, buf));
        const offset = sig[sig.length - 1] & 0xf;
        const code =
          (((sig[offset] & 0x7f) << 24) |
            (sig[offset + 1] << 16) |
            (sig[offset + 2] << 8) |
            sig[offset + 3]) %
          10 ** digits;
        return code.toString().padStart(digits, "0");
      }

      const totpRemaining = (period = 30) => period - (Math.floor(Date.now() / 1000) % period);

      const ICONS = {
        logo: '<path d="M12 2.2 20 5.1v6.2c0 5.2-3.4 8.9-8 10.5-4.6-1.6-8-5.3-8-10.5V5.1Z"/><circle cx="12" cy="10.2" r="2.3"/><path d="M12 12.5v3.6"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>',
        plus: '<path d="M12 5v14"/><path d="M5 12h14"/>',
        settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',

      function icon(name, size = 16, strokeWidth = 2, extraClass = "") {
        const body = ICONS[name] || "";

      }

      function escapeHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function highlight(text, query) {
        const str = String(text || "");
        const needle = (query || "").trim();
        if (!needle) return escapeHtml(str);
        const idx = str.toLowerCase().indexOf(needle.toLowerCase());
        if (idx === -1) return escapeHtml(str);
        const before = escapeHtml(str.slice(0, idx));
        const match = escapeHtml(str.slice(idx, idx + needle.length));
        const after = escapeHtml(str.slice(idx + needle.length));
        return `${before}<mark class="hl">${match}</mark>${after}`;
      }

      const STORAGE_KEY = "cryptoPass.v1";

      async function copyText(value, label = "値") {

          const sec = state.data?.settings?.clipboardClearSeconds || 0;
          if (sec > 0) {
            state.clipboardTimer = setTimeout(() => {

      function lock() {

      async function saveVault(nextData) {
        state.data = nextData;
        if (state.cryptoKey) {
          const raw = loadRaw();
          if (raw) {
            raw.payload = await encryptJSON(state.cryptoKey, nextData);
            raw.requirePassword = nextData.settings.requirePassword;
            saveRaw(raw);
          }
        }
        updateTheme();
        render();
      }

      async function rekeyVault(newPassword) {
        const salt = randomBytes(16);
        const deviceSecret = newPassword === null ? b64(randomBytes(32)) : undefined;
        const key = await deriveKey(newPassword ?? deviceSecret, salt, 310000);
        const nextData = {
          ...state.data,
          settings: { ...state.data.settings, requirePassword: newPassword !== null }
        };
        const payload = await encryptJSON(key, nextData);
        saveRaw({
          v: 1,
          salt: b64(salt),
          iterations: 310000,
          requirePassword: newPassword !== null,
          deviceSecret,
          payload
        });
        state.cryptoKey = key;
        state.data = nextData;
        render();
      }

      async function createNewVault(password) {
        const salt = randomBytes(16);
        const deviceSecret = password === null ? b64(randomBytes(32)) : undefined;
        const key = await deriveKey(password ?? deviceSecret, salt, 310000);
        const data = {
          entries: [],
          settings: { ...defaultSettings, requirePassword: password !== null }
        };
        const payload = await encryptJSON(key, data);
        saveRaw({
          v: 1,
          salt: b64(salt),
          iterations: 310000,
          requirePassword: password !== null,
          deviceSecret,
          payload
        });
        state.hasVault = true;
        state.cryptoKey = key;
        state.data = data;
        updateTheme();
        render();
      }

      async function unlockVault(password) {
        const raw = loadRaw();

        const secret = raw.requirePassword ? password ?? "" : raw.deviceSecret;
        const key = await deriveKey(secret, unb64(raw.salt), raw.iterations);
        const data = await decryptJSON(key, raw.payload);
        state.cryptoKey = key;
        state.data = data;
